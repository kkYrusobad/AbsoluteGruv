name: Attach release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload obsidian.css
        run: gh release upload "$GITHUB_REF_NAME" obsidian.css --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload manifest.json
        run: gh release upload "$GITHUB_REF_NAME" manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
